mode: dev # dev | jetson_perception | jetson_full
detector: dummy # dummy | jetson | deepstream

loop_rates:
  perception_hz: 20
  behavior_hz: 3
  control_hz: 80
  hardware_hz: 120

deadman_timeout_ms: 250

joint_names:
  - yaw
  - pitch1
  - pitch2
  - roll
  - pitch3

# radians
joint_limits_rad:
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]

# Legacy kinematic geometry reference (from pala_old).
# Not wired into runtime control yet; stored here for upcoming FK/IK work.
dh_params:
  yaw_a: 0.0
  yaw_alpha: -1.57079633
  yaw_d: 0.0635
  # yaw theta0 defaults to 0
  pitch1_a: 0.38735
  pitch1_alpha: 0.0
  pitch1_d: 0.0
  pitch1_theta0_deg: -90
  pitch2_a: 0.0
  pitch2_alpha: -1.57079633
  pitch2_d: 0.0
  pitch2_theta0_deg: 0
  roll_a: 0.0
  roll_alpha: 1.57079633
  roll_d: 0.32385
  # roll theta0 defaults to 0
  pitch3_a: 0.0
  pitch3_alpha: 0.0
  pitch3_d: 0.0

tool:
  offset_5: [-0.0686, 0.0762, 0.0]
  rot_5_deg_zyx: [0.0, 180.0, 0.0]

# Placeholder calibration to be filled when porting PCA9685 driver
servo_calibration:
  bus_number: 7
  address: 0x40
  frequency: 50
  channels: [0, 1, 2, 3, 4]
  per_joint:
    yaw: {min_pulse: 500, max_pulse: 2500, angle_scale: 0.8333, angle_offset: 90, reverse: true}
    pitch1: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: false}
    pitch2: {min_pulse: 500, max_pulse: 2500, angle_scale: 2.0, angle_offset: 50, reverse: false}
    roll: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 100, reverse: false}
    pitch3: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: true}

logging:
  enabled: true
  perception_jsonl: logs/perception.jsonl
  actions_jsonl: logs/actions.jsonl

telemetry_preview:
  enabled: true
  jpeg_path: logs/telemetry/preview/latest.jpg
  meta_path: logs/telemetry/preview/latest.json
  max_hz: 4.0
  max_width: 640
  max_height: 360
  jpeg_quality: 65

camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  pipeline: >
    image/jpeg,width=640,height=480,framerate=30/1 !
    jpegdec !
    videoconvert !
    video/x-raw,format=RGB !
    appsink name=appsink emit-signals=true max-buffers=2 drop=true sync=false

deepstream:
  config_path: "config/deepstream/peoplenet_int8.txt"
  person_class_id: 0
  conf_threshold: null

cosmos:
  enabled: true
  base_url: "http://160.211.46.144:8000" # Prefer env override: PALA_COSMOS_BASE_URL
  provider: "auto" # auto|openai|cosmos|gemini
  model: "nvidia/cosmos-reason2-2b"
  planner_prompt: "Prioritize calm, safe desk-companion behavior. Always choose one concrete next action."
  policy_identity: "You are PALA, a social desk companion lamp that should feel alive, expressive, and safe."
  policy_capabilities: "You can move head/neck joints via primitives: hold, breath, glance, nod, orient_to_zone. You cannot manipulate external objects, move base position, or physically touch users."
  policy_safety: "Avoid sudden aggressive motion. Prefer stable conservative actions."
  policy_style: "Default style is calm; use curious for gentle tracking and focused for attentive task support."
  # Behavior cadence and parser policy.
  planner_hz: 0.5
  summarizer_hz: 1.0
  planner_event_delta_threshold: 0.65
  planner_event_cooldown_s: 0.7
  planner_max_proposals: 3
  planner_use_env_context: true
  arbiter_min_dwell_s: 1.2
  arbiter_base_margin: 0.10
  idle_after_s: 6.0
  idle_glance_after_s: 10.0
  mode_min_dwell_s: 1.0
  mode_engage_person_conf: 0.45
  mode_disengage_person_conf: 0.20
  stale_penalty_per_s: 0.05
  stale_expire_s: 14.0
  planner_max_frames: 1
  planner_include_latest_frame: true
  # Scene summarizer cadence.
  summary_window_s: 6.0
  summary_max_frames: 1
  summary_max_width: 320
  summary_jpeg_quality: 55
  max_frame_age_ms: 500
  request_min_fresh_frames: 1
  request_timeout_ms: 20000
  behavior_error_backoff_s: 1.5
  behavior_client_error_backoff_s: 5.0
  env_max_tokens: 420
  planner_max_tokens: 480
  response_ttl_ms: 12000
  behavior_env_log_path: "logs/behavior_env.jsonl"
  behavior_planner_log_path: "logs/behavior_planner.jsonl"
  behavior_reasoning_log_path: "logs/behavior_reasoning.jsonl"
  behavior_trace_log_path: "logs/behavior_trace.jsonl"
