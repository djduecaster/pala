mode: dev # dev | jetson_perception | jetson_full
detector: dummy # dummy | jetson | deepstream

loop_rates:
  perception_hz: 20
  behavior_hz: 3
  control_hz: 80
  hardware_hz: 120

deadman_timeout_ms: 250

joint_names:
  - yaw
  - pitch1
  - pitch2
  - roll
  - pitch3

# radians
joint_limits_rad:
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]

# Placeholder calibration to be filled when porting PCA9685 driver
servo_calibration:
  bus_number: 7
  address: 0x40
  frequency: 50
  channels: [0, 1, 2, 3, 4]
  per_joint:
    yaw: {min_pulse: 500, max_pulse: 2500, angle_scale: 0.8333, angle_offset: 90, reverse: true}
    pitch1: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: false}
    pitch2: {min_pulse: 500, max_pulse: 2500, angle_scale: 2.0, angle_offset: 50, reverse: false}
    roll: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 100, reverse: false}
    pitch3: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: true}

logging:
  enabled: true
  perception_jsonl: logs/perception.jsonl
  actions_jsonl: logs/actions.jsonl

telemetry_preview:
  enabled: true
  jpeg_path: logs/telemetry/preview/latest.jpg
  meta_path: logs/telemetry/preview/latest.json
  max_hz: 4.0
  max_width: 640
  max_height: 360
  jpeg_quality: 65

camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  pipeline: >
    image/jpeg,width=640,height=480,framerate=30/1 !
    jpegdec !
    videoconvert !
    video/x-raw,format=RGB !
    appsink name=appsink emit-signals=true max-buffers=2 drop=true sync=false

deepstream:
  config_path: "config/deepstream/peoplenet_int8.txt"
  person_class_id: 0
  conf_threshold: null

cosmos:
  enabled: true
  provider: "brev"
  base_url: "http://160.211.46.144:8000" # Prefer env override: PALA_COSMOS_BASE_URL
  model: "nvidia/cosmos-reason2-2b"
  planner_prompt: "Prioritize calm, safe desk-companion behavior. Prefer hold/breath unless confidence is high."
  policy_version: "v1"
  identity_file_path: "memory/identity.md"
  policy_identity: "You are PALA, a social desk companion lamp that should feel alive, expressive, and safe."
  policy_capabilities: "You can move head/neck joints via primitives: hold, breath, glance, nod, orient_to_zone. You cannot manipulate external objects, move base position, or physically touch users."
  policy_safety: "Avoid sudden aggressive motion. Prefer stable behavior. If uncertain, choose conservative actions."
  policy_style: "Default style is calm; use curious for gentle tracking and focused for attentive task support."
  policy_output_contract: "Return JSON only with target_state,intent,style,primitive_hint,target_zone,allow_interrupt,urgency,confidence,rationale."
  # Planner cadence and parser policy.
  max_hz: 0.6
  planner_hz: 0.6
  planner_strict_schema: true
  planner_allow_frame_fetch: true
  planner_max_tool_calls_per_cycle: 1
  # Cosmos-first: include image frames on initial planning request each cycle.
  planner_include_images_first_pass: true
  # Scene summarizer cadence.
  summarizer_enabled: true
  summarizer_hz: 1.0
  summarizer_timeout_ms: 6000
  summary_window_s: 6.0
  summary_max_frames: 4
  summary_max_width: 320
  summary_jpeg_quality: 55
  summary_ttl_ms: 6000
  max_frame_age_ms: 500
  # Legacy planner media knobs (kept for compatibility).
  video_window_s: 6.0
  video_max_frames: 4
  video_max_width: 320
  video_jpeg_quality: 55
  request_timeout_ms: 6000
  response_ttl_ms: 5000
  # Legacy memory knobs (deprecated): retained for compatibility only; current planner context uses rolling transcript.
  memory_enabled: true
  memory_jsonl_path: "logs/orchestrator_memory.jsonl"
  memory_recent_events: 10
  memory_digest_items: 3
  memory_distill_every_n_events: 20
  context_max_transcript_items: 0
  context_transcript_max_items: 24
  context_transcript_per_type_max_items: 8
  context_transcript_max_chars: 4000
  context_memory_digest_max_items: 3
  memory_recent_decisions: 8
  memory_recent_summaries: 8
  memory_recent_reasoning: 8
  decision_repeat_detector_window: 6
  orchestrator_timeline_jsonl_path: "logs/orchestrator_timeline.jsonl"
  inflight_guard_enabled: true
  request_min_fresh_frames: 1
  reasoning_probe_enabled: false
  reasoning_probe_hz: 0.1
  reasoning_probe_timeout_ms: 10000
  reasoning_probe_max_tokens: 1024
  commitment_ttl_ms: 12000
  # Cosmos self-critique replan pass: improves decision quality under collapse/stale choices.
  planner_self_critique_enabled: true
  planner_self_critique_confidence: 0.68
  planner_self_critique_margin: 0.05
  planner_self_critique_max_calls_per_cycle: 1
  mock_latency_ms: 150
