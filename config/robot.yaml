mode: dev # dev | jetson_perception | jetson_full
loop_rates:
  perception_hz: 20
  behavior_hz: 3
  control_hz: 80
  hardware_hz: 120

deadman_timeout_ms: 250

joint_names:
  - yaw
  - pitch1
  - pitch2
  - roll
  - pitch3

# radians
joint_limits_rad:
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]
  - [-1.57, 1.57]

# Legacy kinematic geometry reference (from pala_old).
# Not wired into runtime control yet; stored here for upcoming FK/IK work.
dh_params:
  yaw_a: 0.0
  yaw_alpha: -1.57079633
  yaw_d: 0.0635
  # yaw theta0 defaults to 0
  pitch1_a: 0.38735
  pitch1_alpha: 0.0
  pitch1_d: 0.0
  # Pitch frames in sim viewer are defined about local -Z, so positive q pitches forward.
  pitch1_theta0_deg: -90
  pitch2_a: 0.0
  pitch2_alpha: -1.57079633
  pitch2_d: 0.0
  pitch2_theta0_deg: 90
  roll_a: 0.0
  roll_alpha: 1.57079633
  roll_d: 0.32385
  # roll theta0 defaults to 0
  pitch3_a: 0.0
  pitch3_alpha: 0.0
  pitch3_d: 0.0

tool:
  offset_5: [-0.0686, 0.0762, 0.0]
  rot_5_deg_zyx: [0.0, 180.0, 0.0]

# Placeholder calibration to be filled when porting PCA9685 driver
servo_calibration:
  bus_number: 7
  address: 0x40
  frequency: 50
  channels: [0, 1, 2, 3, 4]
  per_joint:
    yaw: {min_pulse: 500, max_pulse: 2500, angle_scale: 0.8333, angle_offset: 90, reverse: true}
    pitch1: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: false}
    pitch2: {min_pulse: 500, max_pulse: 2500, angle_scale: 2.0, angle_offset: 50, reverse: false}
    roll: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 100, reverse: false}
    pitch3: {min_pulse: 500, max_pulse: 2500, angle_scale: 1.0, angle_offset: 80, reverse: true}

logging:
  enabled: true
  perception_jsonl: logs/perception.jsonl
  actions_jsonl: logs/actions.jsonl

telemetry_preview:
  enabled: true
  jpeg_path: logs/telemetry/preview/latest.jpg
  meta_path: logs/telemetry/preview/latest.json
  max_hz: 4.0
  max_width: 640
  max_height: 360
  jpeg_quality: 65

camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  pipeline: >
    image/jpeg,width=640,height=480,framerate=30/1 !
    jpegdec !
    videoconvert !
    video/x-raw,format=RGB !
    appsink name=appsink emit-signals=true max-buffers=2 drop=true sync=false

# Reserved remote-model connection settings. Runtime behavior remains hold-only
# until the new behavior contract is designed in Phase 3.
cosmos:
  enabled: false
  base_url: null
  provider: "auto"
  model: "nvidia/cosmos-reason2-2b"
  planner_prompt: "Describe the scene and choose one next behavior."
  request_timeout_ms: 20000
