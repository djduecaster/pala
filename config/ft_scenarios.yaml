version: 1
split_seed: "pala-ft-v1"
split_ratio:
  train: 0.80
  val: 0.10
  test: 0.10

scenarios:
  - id: walk_into_frame_ack
    title: Walk Into Frame Acknowledge
    description: Operator enters frame and establishes presence. Lamp should strongly acknowledge and transition toward engagement behavior.
    operator_setup_notes: Start out of frame. Enter frame naturally and stop near desk center.
    countdown_s: 5
    duration_s: 5
    sample_fps: 1
    tags: [presence, acknowledge, entry]
    label_template:
      expected_decision:
        schema_version: pala.behavior_decision.v1
        mode: social_interact
        mood: excited
        skill: greet_user
        action:
          primitive: nod
          command:
            amp_rad: 0.2
            duration_s: 0.5
            cycles: 1
            rate_rad_s: 1.8
          style: focused
        confidence: 0.9
        rationale_short: Person entered frame with high novelty; acknowledge immediately.
        mode_transition: to_social_interact
      rationale_text: Person entered frame with high novelty; prioritize clear acknowledgement.

  - id: pick_up_book_assist_light
    title: Pick Up Book Assist Lighting
    description: Operator picks up a book in view. Lamp should orient and adopt attentive assistive behavior for reading context.
    operator_setup_notes: Keep book on desk initially, then raise it into visible reading posture.
    countdown_s: 5
    duration_s: 5
    sample_fps: 1
    tags: [task_support, reading, assist]
    label_template:
      expected_decision:
        schema_version: pala.behavior_decision.v1
        mode: task_lighting
        mood: focused
        skill: task_light_adjust
        action:
          primitive: orient_to_zone
          command:
            zone: center
            amp_rad: 0.22
            rate_rad_s: 1.4
          style: focused
        confidence: 0.88
        rationale_short: Book raised into reading posture; assist by orienting for task lighting.
        mode_transition: to_task_lighting
      rationale_text: Reading-object interaction suggests focused task support and attentive orientation.

  - id: idle_scene_stable
    title: Idle Stable Scene
    description: Scene remains stable with no meaningful user interaction. Lamp should maintain calm subtle presence.
    operator_setup_notes: Keep scene mostly static for full take duration.
    countdown_s: 5
    duration_s: 5
    sample_fps: 1
    tags: [idle, baseline]
    label_template:
      expected_decision:
        schema_version: pala.behavior_decision.v1
        mode: idle_presence
        mood: calm
        skill: social_ack
        action:
          primitive: breath
          command:
            amp_rad: 0.06
            period_s: 6.5
            rate_rad_s: 1.0
          style: calm
        confidence: 0.8
        rationale_short: No salient change detected; maintain calm low-amplitude idle presence.
        mode_transition: stay
      rationale_text: No salient event; preserve calm low-amplitude idle behavior.
