[project]
name = "pala"
version = "0.1.0"
description = "Five-axis expressive desk lamp with deterministic control and optional model tooling"
readme = "README.md"
requires-python = ">=3.10.12,<3.13"
dependencies = [
    "numpy>=1.26.4,<2",
    "openai>=1.50.0",
    "pillow>=12.1.0",
    "pyyaml>=6.0.1",
    "smbus2>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["pala*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pala"]
omit = [
    "pala/hardware/camera_gst.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
