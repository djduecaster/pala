[project]
name = "pala"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.12,<3.13"
dependencies = [
    "fastapi>=0.134.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.23.0",
    "numpy>=1.26.4,<2",
    "openai>=1.50.0",
    "pillow>=12.1.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.1",
    "smbus2>=0.6.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "onnx>=1.20.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["pala*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pala"]
omit = [
    "pala/hardware/camera_gst.py",
    "pala/perception/detector/deepstream_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
