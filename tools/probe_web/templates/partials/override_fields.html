<div class="json-toolbar">
  <button type="button" class="btn-secondary" id="json-validate-btn">Validate Override JSON</button>
  <button type="button" class="btn-secondary" id="json-format-btn">Format Override JSON</button>
  <span id="json-editor-status" class="muted small">JSON fields are editable and optional.</span>
</div>

<div class="grid two">
  <label class="full">
    Context Override JSON
    <textarea id="context-override-json" name="context_override_json" rows="8" placeholder="Optional full context override JSON" data-json-field="context">{{ form_values.context_override_json }}</textarea>
  </label>
  <label class="full">
    User Text Override
    <textarea id="user-text-override" name="user_text_override" rows="8" placeholder="Optional full user text override">{{ form_values.user_text_override }}</textarea>
  </label>
  <label class="full">
    Payload Override JSON
    <textarea id="payload-override-json" name="payload_override_json" rows="10" placeholder="Optional full payload override JSON" data-json-field="payload">{{ form_values.payload_override_json }}</textarea>
  </label>
</div>
