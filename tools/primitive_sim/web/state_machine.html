<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PALA Lamp Sim - State Machine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="state_machine.css">
  </head>
  <body class="state-machine-page">
    <main class="layout">
      <section class="stage-card">
        <svg id="fsmGraph" viewBox="0 0 960 620" aria-label="Lamp behavior state machine"></svg>
      </section>

      <aside class="control-card">
        <header>
          <h1>PALA Lamp Sim - State Machine</h1>
          <p id="configPath">Config: loading...</p>
          <p id="modeLabel">Mode: loading...</p>
        </header>

        <section class="group mode-group">
          <div class="row mode-nav">
            <a class="nav-btn" href="/tools/primitive_sim/web/index.html?studio=1">Studio</a>
            <a class="nav-btn" href="/tools/primitive_sim/web/joint_checker.html">Joint Checker</a>
            <a class="nav-btn" href="/tools/primitive_sim/web/state_machine.html">State Machine</a>
            <a class="nav-btn" href="/tools/primitive_sim/web/scenario_lab.html">Scenario Lab</a>
            <button id="runSuiteBtn" type="button">Run Suite Playback</button>
          </div>
          <p id="suiteStatus" class="muted">Suite: idle</p>
        </section>

        <section class="group">
          <div class="row">
            <button id="stepBtn" type="button">Step</button>
            <button id="autoBtn" type="button">Auto Run</button>
            <button id="resetBtn" type="button">Reset FSM</button>
            <label class="inline stack" for="dtInput">
              dt (s)
              <input id="dtInput" type="number" min="0.05" max="10" step="0.05" value="0.35">
            </label>
          </div>
          <div class="row">
            <label class="inline" for="commitToggle">
              <input id="commitToggle" type="checkbox">
              Commit action this step
            </label>
            <label class="inline stack" for="zoneHintSelect">
              Zone hint
              <select id="zoneHintSelect">
                <option value="">(none)</option>
                <option value="left">left</option>
                <option value="center">center</option>
                <option value="right">right</option>
              </select>
            </label>
          </div>
        </section>

        <section class="group">
          <div class="signal-grid">
            <label class="inline" for="personPresentInput">
              <input id="personPresentInput" type="checkbox">
              Person present
            </label>

            <label class="signal-row" for="personConfRange">
              <span>Person conf</span>
              <input id="personConfRange" type="range" min="0" max="1" step="0.01" value="0">
              <input id="personConfInput" type="number" min="0" max="1" step="0.01" value="0">
            </label>

            <label class="signal-row" for="activityRange">
              <span>Activity level</span>
              <input id="activityRange" type="range" min="0" max="1" step="0.01" value="0">
              <input id="activityInput" type="number" min="0" max="1" step="0.01" value="0">
            </label>

            <label class="signal-row" for="noveltyRange">
              <span>Novelty</span>
              <input id="noveltyRange" type="range" min="0" max="1" step="0.01" value="0">
              <input id="noveltyInput" type="number" min="0" max="1" step="0.01" value="0">
            </label>

            <label class="signal-row" for="envDeltaRange">
              <span>Env delta</span>
              <input id="envDeltaRange" type="range" min="0" max="1" step="0.01" value="0">
              <input id="envDeltaInput" type="number" min="0" max="1" step="0.01" value="0">
            </label>

            <label class="inline" for="plannerBreakerInput">
              <input id="plannerBreakerInput" type="checkbox">
              Planner open breaker
            </label>
            <label class="inline" for="perceptionDegradedInput">
              <input id="perceptionDegradedInput" type="checkbox">
              Perception degraded
            </label>
          </div>
        </section>

        <section class="group">
          <p id="transitionText">Transition: n/a</p>
          <p id="allowedText">Allowed primitives: n/a</p>
        </section>

        <section class="group">
          <table id="proposalTable">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Primitive</th>
                <th>Score</th>
                <th>Style</th>
                <th>Allowed</th>
                <th>Command</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="group">
          <pre id="statusBox">Loading...</pre>
        </section>
      </aside>
    </main>

    <script src="state_machine.js"></script>
  </body>
</html>
